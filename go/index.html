<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 15% 10%,#2479e9 0,transparent 32%),radial-gradient(circle at 90% 85%,#08a78f 0,transparent 30%),linear-gradient(145deg,#071a49,#123f9c 58%,#071a49)}
.wrap{width:min(100%,760px);text-align:center}.panel{padding:clamp(18px,4vw,34px);border:1px solid #ffffff45;border-radius:28px;background:#ffffff12;box-shadow:0 24px 70px #0005;backdrop-filter:blur(12px)}
.kicker{font-size:12px;letter-spacing:2.4px;font-weight:800;color:#ffe16a}
.logo-wrap{width:min(100%,330px);margin:0 auto 18px;padding:13px 18px 15px;border-radius:24px;background:linear-gradient(135deg,#fff,#e9f5ff);border:2px solid #ffffffb8;box-shadow:0 0 0 5px #ffffff18,0 0 26px #38caffaa,0 12px 30px #00174688;position:relative;overflow:hidden;animation:logoFloat 3.8s ease-in-out infinite}
.logo-wrap:before{content:"";position:absolute;top:-80%;left:-45%;width:35%;height:260%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,#ffffffd9,transparent);animation:logoShine 3.2s ease-in-out infinite}
.logo-word{position:relative;z-index:1;display:flex;justify-content:center;align-items:baseline;font-weight:1000;font-size:clamp(38px,10vw,58px);font-style:italic;letter-spacing:-3px;line-height:1;color:#0860b5;text-shadow:0 2px 0 #d5eaff}
.logo-word .mart{color:#e51e35}
.logo-stripe{position:relative;z-index:1;height:12px;margin:7px auto 0;width:88%;border-radius:20px;background:linear-gradient(180deg,#ffdf32 0 36%,#ed1c35 37% 100%);box-shadow:0 3px 0 #d4e7ff}
.logo-caption{position:relative;z-index:1;margin-top:7px;font-size:9px;font-weight:900;letter-spacing:3px;color:#17458b}
@keyframes logoFloat{0%,100%{transform:translateY(0);box-shadow:0 0 0 5px #ffffff18,0 0 22px #38caff88,0 12px 30px #00174688}50%{transform:translateY(-6px);box-shadow:0 0 0 7px #ffffff20,0 0 38px #ffe34daa,0 15px 36px #00174699}}
@keyframes logoShine{0%,20%{left:-50%;opacity:0}45%{opacity:1}75%,100%{left:125%;opacity:0}}
.brand{font-size:clamp(30px,7vw,54px);font-weight:950;line-height:1.02;margin:12px 0 8px;text-shadow:0 4px 18px #001b55aa}.sub{color:#dce9ff;margin:0 0 22px;font-size:15px}
.poster{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 15px 36px #00143e80}
.features{display:grid;gap:13px;margin:24px 0}.features span{display:block;padding:16px 15px;border-radius:15px;background:linear-gradient(100deg,#ffe34d,#ffbd24);color:#172b55;border:2px solid #fff;font-weight:950;font-size:clamp(15px,3.5vw,21px);letter-spacing:.2px;box-shadow:0 6px 18px #00143e55}.features span+span{background:linear-gradient(100deg,#fff,#e4f5ff);color:#b51d2b;border-color:#ffdf45}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:66px;margin:20px 0 10px;padding:15px 20px;border:3px solid #fff;border-radius:18px;background:linear-gradient(180deg,#ff4a4a,#d90020);color:#fff;text-decoration:none;font-size:clamp(19px,4vw,26px);font-weight:950;letter-spacing:.5px;box-shadow:0 9px 0 #8e0015,0 17px 28px #0005;transition:transform .15s,box-shadow .15s}
.cta:active{transform:translateY(6px);box-shadow:0 3px 0 #8e0015,0 8px 15px #0005}
.hint{font-size:12px;color:#d7e4ff}.credit{margin-top:22px;font-weight:850;letter-spacing:2px;color:#ffe16a;font-size:13px}
@media(prefers-reduced-motion:reduce){.logo-wrap,.logo-wrap:before{animation:none}}
</style>
