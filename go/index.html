<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 15% 10%,#2479e9 0,transparent 32%),radial-gradient(circle at 90% 85%,#08a78f 0,transparent 30%),linear-gradient(145deg,#071a49,#123f9c 58%,#071a49)}
.wrap{width:min(100%,760px);text-align:center}.panel{padding:clamp(18px,4vw,34px);border:1px solid #ffffff45;border-radius:28px;background:#ffffff12;box-shadow:0 24px 70px #0005;backdrop-filter:blur(12px)}
.logo-wrap{position:relative;width:min(100%,460px);margin:0 auto 25px;padding:0;background:#fff;border:5px solid #d71935;border-radius:35px 5px 35px 5px;box-shadow:0 0 0 3px #fff,0 0 22px #39baff,0 0 48px #1677ff99,0 14px 30px #00174688;overflow:hidden;animation:logoPulse 3.4s ease-in-out infinite}
.logo-wrap:before{content:"";position:absolute;z-index:2;inset:0 auto 0 -45%;width:30%;transform:skewX(-22deg);background:linear-gradient(90deg,transparent,#ffffffc9,transparent);animation:logoShine 3.6s ease-in-out infinite;pointer-events:none}
.logo-image{display:block;width:100%;height:auto;position:relative}
@keyframes logoPulse{0%,100%{transform:translateY(0);box-shadow:0 0 0 3px #fff,0 0 20px #39baff99,0 0 42px #1677ff66,0 14px 30px #00174688}50%{transform:translateY(-5px);box-shadow:0 0 0 4px #fff,0 0 30px #ffe34dcc,0 0 58px #20baffaa,0 16px 36px #00174699}}
@keyframes logoShine{0%,18%{left:-45%;opacity:0}38%{opacity:1}68%,100%{left:130%;opacity:0}}
.brand{font-size:clamp(30px,7vw,54px);font-weight:950;line-height:1.02;margin:12px 0 8px;text-shadow:0 4px 18px #001b55aa}.sub{color:#dce9ff;margin:0 0 22px;font-size:15px}
.poster{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 15px 36px #00143e80}
.features{display:grid;gap:13px;margin:24px 0}.features span{display:block;padding:16px 15px;border-radius:15px;background:linear-gradient(100deg,#ffe34d,#ffbd24);color:#172b55;border:2px solid #fff;font-weight:950;font-size:clamp(15px,3.5vw,21px);letter-spacing:.2px;box-shadow:0 6px 18px #00143e55}.features span+span{background:linear-gradient(100deg,#fff,#e4f5ff);color:#b51d2d;border-color:#ffdf45}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:66px;margin:20px 0 10px;padding:15px 20px;border:3px solid #fff;border-radius:18px;background:linear-gradient(180deg,#ff4a4a,#d90020);color:#fff;text-decoration:none;font-size:clamp(19px,4vw,26px);font-weight:950;letter-spacing:.5px;box-shadow:0 9px 0 #8e0015,0 17px 28px #0005;transition:transform .15s,box-shadow .15s}
.cta:active{transform:translateY(6px);box-shadow:0 3px 0 #8e0015,0 8px 15px #0005}.hint{font-size:12px;color:#d7e4ff}.credit{margin-top:22px;font-weight:850;letter-spacing:2px;color:#ffe16a;font-size:13px}
@media(prefers-reduced-motion:reduce){.logo-wrap,.logo-wrap:before{animation:none}}
