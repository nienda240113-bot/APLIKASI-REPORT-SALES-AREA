/* ===== Modern responsive interface refresh ===== */
:root{
  --ink:#17233b;--muted:#66748b;--line:#e4eaf3;--blue:#3267e8;--blue2:#5a8cff;
  --teal:#10b9a5;--surface:#ffffff;--soft:#f4f7ff;--shadow:0 16px 42px rgba(35,65,120,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  min-height:100vh;padding:clamp(12px,3vw,30px);color:var(--ink);line-height:1.55;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(ellipse at 8% 2%,rgba(91,143,255,.18),transparent 34%),
             radial-gradient(ellipse at 95% 10%,rgba(27,205,181,.13),transparent 30%),
             linear-gradient(145deg,#f4f7ff 0%,#f8fbff 48%,#effaf8 100%);
  background-attachment:fixed;
}
.container{
  width:min(100%,1040px);margin:0 auto;padding:clamp(17px,3.2vw,34px);
  border:1px solid rgba(255,255,255,.9);border-radius:26px;background:rgba(255,255,255,.94);
  box-shadow:var(--shadow);animation:portalEnter .65s cubic-bezier(.2,.75,.25,1) both;
}
@keyframes portalEnter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
h2{
  position:relative;overflow:hidden;margin:0 0 9px;padding:25px 24px;border:0;border-radius:21px;
  color:#fff;font-size:clamp(23px,4vw,32px);font-weight:850;letter-spacing:-.7px;
  background:linear-gradient(115deg,#2456d8 0%,#397ce9 52%,#13b9a7 100%);
  box-shadow:0 12px 25px rgba(50,103,232,.22);
}
h2:after{content:"";position:absolute;width:190px;height:190px;right:-48px;top:-105px;border:1px solid #ffffff55;border-radius:50%;box-shadow:0 0 0 22px #ffffff0c,0 0 0 45px #ffffff0a}
.container>p[style]{margin:0 0 15px!important;padding:0 4px;color:var(--muted)!important;font-size:12px!important}
#loadingStatus{display:block;width:fit-content;max-width:100%;margin:0 0 24px;padding:9px 13px;border:1px solid #cdeee8;border-radius:999px;background:#effcf9;color:#087d70;font-size:12px;line-height:1.4;white-space:normal}
h3{display:flex;align-items:center;gap:10px;margin:27px 0 15px;padding:0 0 10px;border:0;border-bottom:1px solid var(--line);color:#244b9d;font-size:18px;font-weight:800;letter-spacing:-.25px}
h3:before{content:"";display:inline-block;width:5px;height:21px;flex:0 0 5px;border-radius:8px;background:linear-gradient(180deg,var(--blue2),var(--teal))}
.form-group{min-width:0;margin:0 0 15px}
label{display:block;margin:0 0 7px;color:#40516c;font-size:13px;font-weight:750;letter-spacing:.05px}
input,select{width:100%;min-width:0;min-height:46px;padding:11px 13px;border:1px solid #d8e1ef;border-radius:12px;outline:none;background:#fbfcff;color:#1b2942;font:inherit;font-size:15px;transition:border-color .2s,box-shadow .2s,background .2s,transform .2s}
input::placeholder{color:#a0aabd}
input:focus,select:focus{border-color:#6391f4;background:#fff;box-shadow:0 0 0 4px rgba(70,124,235,.12)}
input[readonly],input.auto-calc{border-color:#dce7f7;background:#edf4ff;color:#2855a4;font-weight:750}
.row-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.row-grid>div{min-width:0}
table{display:block;width:100%;max-width:100%;margin:10px 0 20px;overflow-x:auto;border:1px solid var(--line);border-spacing:0;border-collapse:separate;border-radius:15px;background:#fff;font-size:13px;scrollbar-width:thin;scrollbar-color:#b9c9e6 transparent}
table thead,table tbody{width:100%}
table tr{background:#fff}
th,td{min-width:78px;padding:10px 9px;border:0;border-bottom:1px solid #edf1f7;border-right:1px solid #edf1f7;text-align:center;white-space:nowrap}
th{position:sticky;top:0;background:#edf3ff;color:#294d91;font-weight:800}
th:first-child{border-top-left-radius:12px}th:last-child{border-top-right-radius:12px}tr:last-child td{border-bottom:0}td:last-child,th:last-child{border-right:0}
td:first-child{text-align:center;color:#63728a;font-weight:700}
input.table-input{width:100%;min-width:88px;min-height:39px;padding:7px 8px;border:1px solid #dce4f0;border-radius:9px;background:#fbfcff;text-align:center;font-size:14px}
input.table-input:focus{border-color:#6391f4;background:#fff}
.note{margin:-5px 0 10px;color:var(--muted);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:49px;margin:11px 0 0;padding:13px 17px;border:0;border-radius:13px;color:#fff;font-size:14px;font-weight:800;letter-spacing:.1px;cursor:pointer;box-shadow:0 7px 15px rgba(38,73,130,.12);transition:transform .18s,filter .18s,box-shadow .18s}
.btn:hover:not(:disabled){filter:brightness(1.05);transform:translateY(-2px);box-shadow:0 11px 20px rgba(38,73,130,.18)}
.btn:active:not(:disabled){transform:scale(.985)}
.btn-target{background:linear-gradient(110deg,#2466dc,#3987f1)}
.btn-preview{background:linear-gradient(110deg,#078eaa,#14b9bd)}
.btn-wa{background:linear-gradient(110deg,#0da66b,#20c889)}
.btn-rekap{background:linear-gradient(110deg,#6951c9,#9270ed)}
.btn:disabled{background:#c7cfdd!important;color:#fff;box-shadow:none;cursor:not-allowed;opacity:.8}
.modal{display:none;padding:16px;background:rgba(13,25,48,.58);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fadeIn .2s ease}
.modal-content{position:relative;margin:4vh auto;padding:22px;border:1px solid #ffffffb0;border-radius:20px;background:#fff;box-shadow:0 22px 70px #0d1a3540;width:min(100%,680px);max-height:90vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.7}
#modalTitle{padding-right:65px;color:#244b9d;font-family:inherit;font-size:17px;font-weight:800}
#previewText{padding:12px;border-radius:12px;background:#f5f8ff;color:#24334d}
.close-btn{position:sticky;top:0;float:right;padding:9px 14px;border:0;border-radius:9px;background:#e84e62;color:#fff;font-weight:800;cursor:pointer}
button:focus-visible{outline:3px solid #80a8ff;outline-offset:3px}
@media(min-width:850px){.container{padding:34px 42px}.btn{max-width:100%}}
@media(max-width:600px){
 body{padding:9px;background-attachment:scroll}.container{padding:14px;border-radius:19px}

 .btn{min-height:51px;font-size:13px}.modal-content{margin:2vh auto;padding:16px;border-radius:16px}
}
@media(max-width:370px){.row-grid{grid-template-columns:1fr}.container{padding:11px}h2{font-size:21px}}

/* ===== Alfamart animated brand header ===== */
.brand-stage{
  position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;min-height:190px;margin:0 0 18px;padding:18px 14px 15px;

  box-shadow:0 16px 38px rgba(34,69,140,.10),inset 0 1px 0 #fff;
}
.brand-stage:before,.brand-stage:after{content:"";position:absolute;z-index:-1;left:50%;top:43%;width:230px;height:130px;
  border:1px solid rgba(54,111,231,.20);border-radius:50%;transform:translate(-50%,-50%) rotate(-12deg);
  animation:brandOrbit 8s ease-in-out infinite}
.brand-stage:after{width:290px;height:155px;border-color:rgba(16,188,169,.16);transform:translate(-50%,-50%) rotate(18deg);animation-delay:-3s}
.brand-aura{position:absolute;z-index:-1;width:240px;height:120px;left:50%;top:43%;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(ellipse,rgba(63,121,238,.18),rgba(20,190,171,.08) 48%,transparent 72%);
  filter:blur(8px);animation:auraPulse 4.5s ease-in-out infinite}
.brand-logo-shell{position:relative;display:grid;place-items:center;width:min(100%,390px);padding:9px 13px;
  border:1px solid rgba(255,255,255,.98);border-radius:19px;background:rgba(255,255,255,.94);
  box-shadow:0 13px 30px rgba(35,58,105,.14),0 0 0 5px rgba(255,255,255,.34);
  animation:logoFloat 5s ease-in-out infinite;overflow:hidden}
.brand-logo-shell:after{content:"";position:absolute;top:-60%;left:-45%;width:34%;height:220%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.78),transparent);
  transform:rotate(22deg);animation:logoShine 6s ease-in-out infinite;pointer-events:none}
.brand-logo{display:block;width:100%;max-width:360px;height:auto;object-fit:contain;border-radius:10px}

@keyframes logoShine{0%,58%{left:-48%;opacity:0}68%{opacity:.9}84%,100%{left:125%;opacity:0}}
@keyframes auraPulse{0%,100%{opacity:.62;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}
@keyframes brandOrbit{0%,100%{opacity:.42}50%{opacity:.95;transform:translate(-50%,-50%) rotate(8deg) scale(1.06)}}
